<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Smartbox Kelas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: satu panggung. Kotak 3D bertutup segitiga membuka jadi 4 petak (sisi); sisi yang diketuk membuka panel penuh. Guru memimpin lewat dokumen class/state. */
:root{
  --bg:#e6f5ff; --surface:#ffffff; --surface-2:#f1f9ff; --ink:#0e2748; --muted:#4a6788; --line:#c6e2f6;
  --outline:#143e72; --accent:#2a7de1; --accent-ink:#ffffff;
  --f1:#ff7d8f; --f2:#3aa0ff; --f3:#ffb52e; --f4:#27cf9a;
  --flap:color-mix(in srgb,var(--accent) 45%,#fff); --flap2:color-mix(in srgb,var(--accent) 62%,#fff);
  --wall:color-mix(in srgb,var(--accent) 80%,#06203f); --tray:color-mix(in srgb,var(--accent) 28%,#fff);
  --cloud:#ffffff; --good:#13946a; --bad:#d23f4d; --sun:#ffc93c;
  --font-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif; --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1a31; --surface:#12294b; --surface-2:#173358; --ink:#e9f4ff; --muted:#a2bddc; --line:#294b78;
  --outline:#041326; --flap:color-mix(in srgb,var(--accent) 55%,#0a1a31); --flap2:color-mix(in srgb,var(--accent) 42%,#0a1a31);
  --wall:color-mix(in srgb,var(--accent) 55%,#020b18); --tray:color-mix(in srgb,var(--accent) 24%,#0a1a31);
  --cloud:#6f98c8; --good:#36d6a0; --bad:#ff7b87; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1a31; --surface:#12294b; --surface-2:#173358; --ink:#e9f4ff; --muted:#a2bddc; --line:#294b78;
  --outline:#041326; --flap:color-mix(in srgb,var(--accent) 55%,#0a1a31); --flap2:color-mix(in srgb,var(--accent) 42%,#0a1a31);
  --wall:color-mix(in srgb,var(--accent) 55%,#020b18); --tray:color-mix(in srgb,var(--accent) 24%,#0a1a31);
  --cloud:#6f98c8; --good:#36d6a0; --bad:#ff7b87; color-scheme:dark}
html[data-tema="laut"]{--accent:#0b9db8;--f1:#ff8a6b;--f2:#0b9db8;--f3:#ffd23f;--f4:#3ed6a0}
html[data-tema="hutan"]{--accent:#27995f;--f1:#ff8f6b;--f2:#27995f;--f3:#f2b73a;--f4:#4aa8f5}
html[data-tema="surya"]{--accent:#ff9f1c;--accent-ink:#3a2200;--f1:#ff6b6b;--f2:#ff9f1c;--f3:#ffd23f;--f4:#3ac4a0}
html[data-tema="anggur"]{--accent:#7d5cf0;--f1:#ff7aa8;--f2:#7d5cf0;--f3:#ffc13d;--f4:#34cfa5}
html[data-tema="permen"]{--accent:#ff6fae;--accent-ink:#3d0d26;--f1:#ff6fae;--f2:#5fb4ff;--f3:#ffcb47;--f4:#5fe0b7}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0;overflow-x:clip;margin:0}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.muted{color:var(--muted)}
.sky{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 30%,var(--bg)) 0%,var(--bg) 62%);overflow:hidden;pointer-events:none}
.cloud{position:absolute;width:150px;height:46px;background:var(--cloud);border-radius:99px;opacity:.75;animation:drift 70s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:var(--cloud);border-radius:50%}
.cloud::before{width:62px;height:62px;left:24px;top:-30px}.cloud::after{width:78px;height:78px;left:60px;top:-42px}
.c1{top:9%;left:-200px}.c2{top:28%;left:-200px;animation-duration:95s;animation-delay:-40s;transform:scale(.7)}.c3{top:62%;left:-200px;animation-duration:120s;animation-delay:-80s;transform:scale(1.2);opacity:.5}
@keyframes drift{to{translate:calc(100vw + 400px) 0}}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-block:calc(12px + env(safe-area-inset-top,0px)) 12px;max-width:1100px;margin-inline:auto}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:800;font-size:22px;margin-right:auto}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--accent);border:3px solid var(--outline);box-shadow:0 3px 0 var(--outline);display:block;position:relative}
.brand i::after{content:"";position:absolute;inset:5px;border-radius:3px;background:#fff;opacity:.9;clip-path:polygon(0 0,100% 0,50% 100%)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;background:var(--surface);border:2px solid var(--line);font-weight:700;font-size:14px;max-width:100%}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--outline)}
.iconbtn{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:var(--surface);border:3px solid var(--outline);box-shadow:0 4px 0 var(--outline);cursor:pointer}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--outline)}
.iconbtn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.on{background:var(--sun)}.iconbtn.on svg{stroke:#10294d}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:8px 20px;border-radius:16px;border:3px solid var(--outline);background:var(--accent);color:var(--accent-ink);font-family:var(--font-display);font-weight:800;font-size:18px;box-shadow:0 5px 0 var(--outline);cursor:pointer;text-decoration:none;transition:transform .08s,box-shadow .08s}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--outline)}
.btn.sm{min-height:36px;padding:4px 14px;font-size:15px;border-radius:12px;box-shadow:0 3px 0 var(--outline)}
.btn.sm:active{transform:translateY(2px);box-shadow:0 1px 0 var(--outline)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.sun{background:var(--sun);color:#10294d}
.btn.danger{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.5;pointer-events:none}
.card{background:var(--surface);border:3px solid var(--outline);border-radius:24px;box-shadow:0 8px 0 var(--outline);padding:clamp(18px,3vw,28px)}

/* home */
.screen{max-width:1100px;margin-inline:auto;padding-block:8px 96px}
.home-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:clamp(20px,5vw,64px);align-items:center}
.home-grid.opened{grid-template-columns:minmax(0,1fr)}
.stage-wrap{--s:min(70vw,400px);display:grid;justify-items:center;padding:calc(var(--s)*.34) 0 calc(var(--s)*.3);min-width:0}
.home-grid.opened .stage-wrap{--s:min(84vw,500px)}
.stage{position:relative;width:var(--s);height:var(--s);perspective:1900px;animation:bob 4s ease-in-out infinite}
.stage.open{animation:none}
@keyframes bob{50%{translate:0 -10px}}
.box{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(36deg);transition:transform 1s cubic-bezier(.2,.9,.3,1.1)}
.stage.open .box{transform:rotateX(30deg)}
.tray{position:absolute;inset:0;border-radius:6%;background:var(--tray);border:4px solid var(--outline);transform-style:preserve-3d;
  box-shadow:inset 0 12px 0 rgba(0,20,60,.16),0 calc(var(--s)*.07) 0 var(--wall),0 calc(var(--s)*.07) 0 4px var(--outline),0 calc(var(--s)*.16) calc(var(--s)*.12) rgba(0,30,80,.28);
  display:grid;grid-template-columns:1fr 1fr;gap:4%;padding:5%}
.cell{--fc:var(--f1);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2%;text-align:center;min-width:0;padding:6%;border-radius:14%;border:3px solid var(--outline);cursor:pointer;color:#0e2748;
  background:linear-gradient(160deg,color-mix(in srgb,var(--fc) 70%,#fff),var(--fc));box-shadow:0 5px 0 var(--outline);opacity:0;pointer-events:none;transform:translateZ(4px);transition:transform .2s,filter .2s}
.stage.open .cell{pointer-events:auto;animation:popin .7s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(.55s + var(--i)*.13s)}
.stage.open .cell:hover{transform:translateZ(4px) scale(1.04);filter:brightness(1.05)}
@keyframes popin{from{opacity:0;transform:translateZ(4px) scale(.3) translateY(40%)}to{opacity:1;transform:translateZ(4px)}}
.cell .ico{width:44%;max-width:84px;fill:#fff;stroke:var(--outline);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round;overflow:visible;filter:drop-shadow(0 3px 0 rgba(0,20,60,.25))}
.cell b{font-family:var(--font-display);font-weight:800;font-size:clamp(14px,calc(var(--s)*.05),22px);line-height:1.1}
.cell small{font-size:clamp(11px,calc(var(--s)*.03),14px);font-weight:700;opacity:.85;line-height:1.2}
.cell .live{position:absolute;top:6px;right:6px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--outline);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.3)}}
.flap{position:absolute;backface-visibility:visible;transition:transform 1.15s cubic-bezier(.3,1.35,.4,1);pointer-events:none}
.flap svg{display:block;width:100%;height:100%;overflow:visible}
.flap,.flap *,.seal,.seal *,.shine{pointer-events:none}
.flap polygon{fill:var(--flap);stroke:var(--outline);stroke-width:4;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.f-l polygon,.f-r polygon{fill:var(--flap2)}
.f-t{left:0;top:0;width:100%;height:50%;transform-origin:50% 0;transform:translateZ(6px)}
.f-b{left:0;bottom:0;width:100%;height:50%;transform-origin:50% 100%;transform:translateZ(6px)}
.f-l{left:0;top:0;width:50%;height:100%;transform-origin:0 50%;transform:translateZ(5px)}
.f-r{right:0;top:0;width:50%;height:100%;transform-origin:100% 50%;transform:translateZ(5px)}
.stage.open .f-t{transform:translateZ(6px) rotateX(118deg)}
.stage.open .f-b{transform:translateZ(6px) rotateX(-118deg)}
.stage.open .f-l{transform:translateZ(5px) rotateY(-108deg)}
.stage.open .f-r{transform:translateZ(5px) rotateY(108deg)}
.seal{position:absolute;left:50%;top:50%;width:27%;aspect-ratio:1;margin:-13.5% 0 0 -13.5%;border-radius:50%;background:var(--sun);border:4px solid var(--outline);box-shadow:0 5px 0 var(--outline);display:grid;place-items:center;transform:translateZ(14px);transition:transform .7s,opacity .5s}
.seal svg{width:56%;fill:#fff;stroke:var(--outline);stroke-width:3;stroke-linejoin:round}
.stage.open .seal{opacity:0;transform:translateZ(14px) scale(.2) rotate(200deg)}
.shine{position:absolute;inset:0;pointer-events:none;border-radius:6%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);transform:translateZ(7px);animation:shine 3.4s ease-in-out infinite}
.stage.open .shine{display:none}
@keyframes shine{0%,60%{background-position:-200% 0}100%{background-position:200% 0}}

.login h1{font-size:clamp(30px,5vw,40px)}
.login .lesson{margin:6px 0 16px;color:var(--muted);font-weight:700}
.field{display:grid;gap:4px;margin-bottom:14px}
.field label{font-weight:800;font-size:14px;letter-spacing:.02em}
.field input,.field select,.field textarea{width:100%;min-height:46px;padding:8px 14px;border-radius:14px;border:3px solid var(--outline);background:var(--surface-2);font-weight:600}
.field textarea{resize:vertical;min-height:96px}
.err{color:var(--bad);font-weight:800;min-height:1.4em;font-size:14px}
.login .btn{width:100%}
.login .alt{display:grid;gap:10px;margin-top:14px;padding-top:14px;border-top:2px dashed var(--line)}
.hello{text-align:center;display:grid;gap:6px;justify-items:center;padding-bottom:6px}
.hello h2{font-size:clamp(26px,5vw,38px)}
.hello .chip{background:var(--surface)}

/* panel */
.pcard{--fc:var(--f1);background:var(--surface);border:3px solid var(--outline);border-radius:28px;box-shadow:0 8px 0 var(--outline);overflow:hidden;animation:zoomin .45s cubic-bezier(.3,1.3,.5,1)}
@keyframes zoomin{from{opacity:0;transform:scale(.88) translateY(20px)}}
.phead{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px clamp(14px,3vw,24px);background:linear-gradient(160deg,color-mix(in srgb,var(--fc) 70%,#fff),var(--fc));border-bottom:3px solid var(--outline);color:#0e2748}
.phead h2{font-size:clamp(22px,4vw,30px);margin-right:auto}
.phead .btn{background:#fff;color:#0e2748}
.tabs4{display:flex;gap:8px}
.tabs4 button{width:44px;height:44px;border-radius:14px;border:3px solid var(--outline);background:color-mix(in srgb,var(--c) 40%,#fff);cursor:pointer;display:grid;place-items:center;box-shadow:0 3px 0 var(--outline)}
.tabs4 button.on{background:var(--c);transform:translateY(2px);box-shadow:0 1px 0 var(--outline)}
.tabs4 .ico{width:24px;fill:#fff;stroke:var(--outline);stroke-width:3;stroke-linejoin:round}
.pbody{padding:clamp(16px,3vw,28px);display:grid;gap:28px;min-width:0}
#pcontent{display:grid;gap:22px;min-width:0}
.banner{padding:10px 14px;border-radius:14px;background:var(--sun);color:#10294d;font-weight:800;border:3px solid var(--outline)}
.follow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:var(--surface-2);border:2px dashed var(--accent);font-weight:700}
.follow .live{width:12px;height:12px;border-radius:50%;background:var(--good);animation:pulse 1.2s infinite}

.feels{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:12px}
.feel{display:grid;justify-items:center;gap:2px;padding:12px 6px;border-radius:20px;border:3px solid var(--outline);background:var(--surface-2);cursor:pointer;box-shadow:0 5px 0 var(--outline);transition:transform .12s;animation:hop .5s both;animation-delay:var(--d)}
@keyframes hop{from{opacity:0;transform:translateY(24px) scale(.8)}}
.feel .emo{font-size:clamp(38px,8vw,52px);line-height:1.1;transition:transform .2s}
.feel b{font-family:var(--font-display);font-size:16px}
.feel:hover .emo{transform:scale(1.18) rotate(-6deg)}
.feel.on{background:var(--f1);color:#0e2748;transform:translateY(3px);box-shadow:0 2px 0 var(--outline)}
.feel.on .emo{animation:wob .6s}
@keyframes wob{30%{transform:scale(1.35) rotate(10deg)}60%{transform:scale(1.1) rotate(-8deg)}}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row .grow{margin-right:auto}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:36px 1fr 34px;gap:10px;align-items:center}
.bar i{display:block;height:18px;border-radius:99px;background:var(--f1);border:2px solid var(--outline);min-width:6px;transition:width .5s}
.sub{display:flex;flex-wrap:wrap;gap:8px}
.sub button{padding:6px 16px;border-radius:99px;border:3px solid var(--outline);background:var(--surface-2);font-family:var(--font-display);font-weight:800;font-size:16px;cursor:pointer}
.sub button.on{background:var(--accent);color:var(--accent-ink)}
.styles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.style{--c:var(--f2);display:grid;justify-items:center;gap:4px;text-align:center;padding:14px 10px;border-radius:20px;border:3px solid var(--outline);cursor:pointer;color:#0e2748;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 60%,#fff),var(--c));box-shadow:0 5px 0 var(--outline);transition:transform .12s}
.style:hover{transform:translateY(-3px)}
.style.on{transform:translateY(3px);box-shadow:0 2px 0 var(--outline);outline:4px solid var(--sun)}
.style .ico{width:42px;fill:#fff;stroke:var(--outline);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.style b{font-family:var(--font-display);font-size:18px}.style small{font-weight:700;font-size:12.5px;line-height:1.25}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.item{display:grid;gap:10px;padding:14px;border-radius:20px;border:3px solid var(--outline);background:var(--surface-2);min-width:0;align-content:start}
.item.focus{outline:5px solid var(--sun);animation:pulse2 1.2s 3}
@keyframes pulse2{50%{transform:scale(1.02)}}
.item h4{font-size:19px}.item p{color:var(--muted);font-size:14.5px;overflow-wrap:anywhere}
.item-img{width:100%;max-height:220px;object-fit:cover;border-radius:12px;border:3px solid var(--outline)}
.qr{justify-self:start;background:#fff;padding:10px;border-radius:14px;border:3px solid var(--outline);line-height:0;color:#143e72;font-size:13px}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:12px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.badge.ex{background:var(--sun);color:#10294d;margin-left:6px}
.item-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.empty{padding:24px;text-align:center;border:3px dashed var(--line);border-radius:20px;color:var(--muted);font-weight:700}
.tgt{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.tgt div{padding:8px 12px;border-radius:14px;background:var(--surface-2);border:2px solid var(--line);font-size:13.5px;line-height:1.3}
.tgt b{font-family:var(--font-display);font-size:16px;display:block}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
.game{--c:var(--f3);text-align:left;display:grid;gap:4px;padding:16px;border-radius:20px;border:3px solid var(--outline);cursor:pointer;color:#0e2748;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 60%,#fff),var(--c));box-shadow:0 5px 0 var(--outline);text-decoration:none;transition:transform .12s}
.game:hover{transform:translateY(-3px)}.game b{font-family:var(--font-display);font-size:19px}.game small{font-weight:700;line-height:1.3}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.team{--tc:var(--f2);border-radius:20px;border:3px solid var(--outline);background:var(--surface-2);overflow:hidden;animation:hop .5s both}
.team h4{padding:8px 14px;background:var(--tc);color:#10294d;border-bottom:3px solid var(--outline);display:flex;justify-content:space-between;gap:8px}
.team ul{list-style:none;margin:0;padding:10px 14px;display:grid;gap:6px}
.team li{display:flex;gap:8px;align-items:center;overflow-wrap:anywhere}
.lv{width:12px;height:12px;border-radius:50%;flex:none;border:2px solid var(--outline)}
.lv1{background:#ff8e8e}.lv2{background:#ffd34d}.lv3{background:#4fd6a5}
.team.me{outline:5px solid var(--sun)}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 16px;border-radius:16px;border:3px solid var(--outline);background:var(--surface-2);cursor:pointer;font-weight:700;box-shadow:0 4px 0 var(--outline)}
.opt .k{flex:none;width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;border:2px solid var(--outline)}
.opt.sel{background:var(--sun);color:#10294d}
.opt.ok{background:var(--good);color:#fff}.opt.no{background:var(--bad);color:#fff}
.opt .n{margin-left:auto;font-family:var(--font-display)}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.mc{perspective:600px;aspect-ratio:1/1.05;border:0;background:none;padding:0;cursor:pointer;min-width:0}
.mc>span{position:absolute;inset:0}
.mc{position:relative}
.mc .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s}
.mc.up .in{transform:rotateY(180deg)}
.mc .fr,.mc .bk{position:absolute;inset:0;backface-visibility:hidden;display:grid;place-items:center;padding:6px;border-radius:14px;border:3px solid var(--outline);text-align:center;font-weight:800;font-size:clamp(11px,2.6vw,15px);line-height:1.15;overflow:hidden;overflow-wrap:anywhere}
.mc .fr{background:var(--accent);color:var(--accent-ink);font-family:var(--font-display);font-size:28px;box-shadow:0 4px 0 var(--outline)}
.mc .bk{background:var(--surface-2);transform:rotateY(180deg)}
.mc.done .bk{background:var(--good);color:#fff}
.board{display:grid;gap:10px}

 doc(p,cb){if(this.db)return this.db.doc(p).onSnapshot(s=>cb(s.exists?clone(s.data()):null),e=>console.warn(p,e&&e.code));

 ensure(){if(this.ctx)return true;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;this.ctx=new AC();this.master=this.ctx.createGain();this.master.gain.value=this.vol*.3;this.master.connect(this.ctx.destination);return true},
 f(m){return 440*Math.pow(2,(m-69)/12)},

   g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(dest||this.master);o.start(t);o.stop(t+dur+.05)},
 start(){if(!this.ensure())return false;this.ctx.resume();this.on=true;this.step=0;this.next=this.ctx.currentTime+.08;clearInterval(this.timer);this.timer=setInterval(()=>this.tick(),120);return true},

 play(s,t,d,m){const [r,minor]=ROOTS[Math.floor(s/8)%4];

$('#mood').addEventListener('change',e=>{Music.mood=e.target.value;lsSet('sb_music',{on:Music.on,mood:Music.mood,vol:Music.vol,sfx:Music.sfxOn})});
$('#vol').addEventListener('input',e=>{Music.vol=e.target.value/100;if(Music.master)Music.master.gain.value=Music.vol*.3});
$('#sfx').addEventListener('change',e=>{Music.sfxOn=e.target.checked});
document.addEventListener('click',e=>{if(!e.target.closest('.relative'))$('#musicPop').hidden=true});
{const m=lsGet('sb_music');if(m){Music.mood=MOODS[m.mood]?m.mood:'ceria';Music.vol=typeof m.vol==='number'?m.vol:.5;Music.sfxOn=m.sfx!==false;$('#mood').value=Music.mood;$('#vol').value=Math.round(Music.vol*100);$('#sfx').checked=Music.sfxOn}}
$('#themeBtn').addEventListener('click',()=>{const r=document.documentElement;const dark=r.dataset.theme==='dark'||(r.dataset.theme!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);r.dataset.theme=dark?'light':'dark'});

function burst(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const st=$('#stage').getBoundingClientRect();const cx=st.left+st.width/2,cy=st.top+st.height/2;
  const cols=['#ff7d8f','#3aa0ff','#ffb52e','#27cf9a','#ffffff','#ffc93c'];
  for(let i=0;i<34;i++){const e=document.createElement('i');e.className='confetti';e.style.background=cols[i%cols.length];e.style.left=cx+'px';e.style.top=cy+'px';document.body.appendChild(e);
    const a=Math.random()*Math.PI*2,v=120+Math.random()*220;
    e.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${Math.cos(a)*v}px,${Math.sin(a)*v-120}px) rotate(${Math.random()*720}deg)`,opacity:1,offset:.6},{transform:`translate(${Math.cos(a)*v*1.2}px,${Math.sin(a)*v+160}px) rotate(900deg)`,opacity:0}],{duration:1400+Math.random()*600,easing:'cubic-bezier(.2,.7,.4,1)'}).onfinish=()=>e.remove()}}

/* ---------- kotak (tray) ---------- */
function renderTray(){
  $('#tray').innerHTML=FACES.map((f,i)=>`<button class="cell" type="button" data-act="face" data-k="${f.k}" style="--fc:${f.c};--i:${i}" aria-label="${esc(f.n)}">${ico(f.k)}<b>${f.n}</b><small>${f.s}</small>${S.cls&&S.cls.face===f.k&&!isT()?'<span class="live" title="Guru membuka sisi ini"></span>':''}</button>`).join('')}

/* ---------- login ---------- */
function applyCfg(){
  document.documentElement.dataset.tema=S.cfg.tema||'langit';
  $('#loginLesson').textContent='Pelajaran hari ini: '+S.cfg.judul+(S.cfg.mapel?' ('+S.cfg.mapel+')':'');
  const c=$('#lessonChip');if(S.opened){c.hidden=false;c.textContent=S.cfg.judul+(S.cfg.mapel?' · '+S.cfg.mapel:'')}
}
$('#loginCard').addEventListener('submit',async e=>{e.preventDefault();
  const n=$('#inName').value.trim(),k=$('#inKelas').value.trim();
  if(n.length<3||!/\s|\w{3,}/.test(n)){$('#loginErr').textContent='Tulis nama lengkapmu terlebih dahulu.';$('#inName').focus();return}
  if(!k){$('#loginErr').textContent='Tulis kelasmu, misalnya 5A.';$('#inKelas').focus();return}
  $('#loginErr').textContent='';await S.ready;
  S.me=Object.assign(newMe(),{name:n,kelas:k});
  lsSet('sb_id',{name:n,kelas:k});
  if(S.uid){try{const old=await Data.get('submissions/'+S.uid);if(old)S.me=Object.assign(newMe(),old,{name:n,kelas:k})}catch(x){}}
  if(S.teacher){S.preview=true}
  enter();flushMe();
});
$('#teacherBtn').addEventListener('click',async()=>{await S.ready;S.preview=false;S.me=Object.assign(newMe(),{name:'Guru',kelas:''});enter()});
function enter(){
  S.opened=true;Music.sfx('open');
  $('#stage').classList.add('open');$('#homeGrid').classList.add('opened');
  $('#loginCard').hidden=true;
  setTimeout(()=>{burst()},350);
  renderHello();applyCfg();renderTray();topChips();renderBar();
  if(!isT())setTimeout(followClass,1400);
}
function renderHello(){const h=$('#hello');h.hidden=false;
  h.innerHTML=isT()?`<h2>Mode Guru</h2><p class="muted">Ketuk sisi kotak untuk memimpin kelas. Murid yang mengikuti akan ikut berpindah.</p>`
  :`<h2>Halo, ${esc(S.me.name.split(' ')[0])}!</h2><span class="chip">${esc(S.me.name)} · Kelas ${esc(S.me.kelas)}${S.preview?' · mode coba':''}</span><p class="muted">Ketuk salah satu sisi kotak.</p>`;}
function topChips(){const w=$('#whoChip');w.hidden=!S.opened;w.textContent=isT()?'Guru':S.me.name+' · '+S.me.kelas;applyCfg();
  const l=$('#liveChip');l.hidden=!(S.opened&&!isT()&&S.cls.face&&S.follow&&S.cls.follow!==false);l.textContent='Mengikuti guru'}

/* ---------- navigasi & memimpin ---------- */
function lead(p){if(!isT())return;S.cls=Object.assign({},S.cls,p,{ts:Date.now()});Data.set('class/state',S.cls).catch(()=>toast('Gagal membagikan ke murid'))}
function show(v){S.view=v;$('#home').hidden=v!=='home';$('#panel').hidden=v!=='panel';$('#results').hidden=v!=='results';renderBar();window.scrollTo({top:0})}
function openFace(k,fromLead){
  S.ui.face=k;Music.sfx('pop');
  if(isT()&&!fromLead){
    if(k==='materi')lead({face:k,mat:S.ui.mat,style:S.ui.style,item:null});
    else if(k==='asesmen')lead({face:k,as:S.ui.as,game:S.ui.game});
    else lead({face:k})}
  renderPanel();show('panel')}
function closePanel(){S.ui.face=null;if(isT())lead({face:null,item:null,game:null,quiz:null});renderTray();show('home')}
function followClass(){
  if(!S.opened||isT()||!S.follow||S.cls.follow===false)return;
  const c=S.cls;
  if(!c.face){if(S.view==='panel'){S.ui.face=null;renderTray();show('home')}else renderTray();topChips();return}
  S.ui.face=c.face;
  if(c.face==='materi'){S.ui.mat=c.mat||'gaya';S.ui.style=c.style||null;S.ui.item=c.item||null}
  if(c.face==='asesmen'){S.ui.as=c.as||'kelompok';S.ui.game=c.game||null}
  renderPanel();if(S.view!=='panel'){Music.sfx('pop');show('panel')}topChips()}

/* ---------- panel ---------- */
function faceOf(k){return FACES.find(f=>f.k===k)}
function renderPanel(){
  const k=S.ui.face;if(!k)return;const f=faceOf(k);const p=$('#panel');
  const following=!isT()&&S.follow&&S.cls.follow!==false&&S.cls.face;
  p.innerHTML=`<div class="pcard" style="--fc:${f.c}"><div class="phead">
    <button class="btn sm" data-act="back" type="button">Kembali ke kotak</button>
    <h2>${f.n}</h2>
    <div class="tabs4">${FACES.map(x=>`<button type="button" data-act="face" data-k="${x.k}" class="${x.k===k?'on':''}" style="--c:${x.c}" aria-label="${esc(x.n)}">${ico(x.k)}</button>`).join('')}</div></div>
    <div class="pbody">${following?`<div class="follow"><span class="live"></span>Guru memimpin kelas. Layarmu ikut berpindah.<button class="btn sm ghost" data-act="unfollow" type="button">Jelajah sendiri</button></div>`:(!isT()&&S.cls.face&&!S.follow?`<div class="follow">Kamu menjelajah sendiri.<button class="btn sm" data-act="refollow" type="button">Ikuti guru lagi</button></div>`:'')}
    ${S.readOnly&&!isT()?`<div class="banner">Akunmu hanya bisa melihat. Minta guru memberi akses Kontributor agar jawabanmu terkirim.</div>`:''}
    <div id="pcontent">${({feeling:rFeeling,materi:rMateri,asesmen:rAsesmen,exit:rExit})[k]()}</div></div></div>`;
  after();}
function after(){
  $$('[data-qr]').forEach(el=>{if(el.dataset.done)return;el.dataset.done=1;
    if(window.QRCode){el.innerHTML='';new QRCode(el,{text:el.dataset.qr,width:150,height:150,colorDark:'#0e2748',colorLight:'#ffffff'})}else el.textContent='QR belum termuat';});}
function setSave(t){const e=$('#saveState');if(e)e.textContent=t}
let pt;function persistMe(){clearTimeout(pt);setSave('Menyimpan...');pt=setTimeout(flushMe,500)}
async function flushMe(){
  S.me.ts=Date.now();
  if(isT()&&!S.preview)return;
  if(!S.uid){setSave('Tersimpan di perangkat');return}
  if(S.preview&&S.db){setSave('Mode coba, tidak dikirim');return}
  try{await Data.set('submissions/'+S.uid,S.me);setSave('Tersimpan')}catch(e){setSave('Gagal menyimpan');S.readOnly=true}}

/* 1. perasaan */
function rFeeling(){const m=me();
  return `<div><h3>Bagaimana perasaanmu hari ini?</h3><p class="muted">Pilih satu wajah yang paling cocok.</p></div>
  <div class="feels" role="radiogroup" aria-label="Perasaan">${FEELS.map(([e,n],i)=>`<button type="button" class="feel ${m.feeling===e?'on':''}" role="radio" aria-checked="${m.feeling===e}" data-act="feel" data-e="${e}" style="--d:${i*60}ms"><span class="emo">${e}</span><b>${n}</b></button>`).join('')}</div>
  <div class="field" style="margin:0"><label for="note">Catatan perasaanmu</label><textarea id="note" maxlength="600" placeholder="Ceritakan mengapa kamu merasa begitu...">${esc(m.note)}</textarea></div>
  <div class="row"><span class="muted grow"><span id="noteCount">${m.note.length}</span>/600 · <span id="saveState"></span></span><button class="btn sm ghost" type="button" data-act="copynote">Salin catatan</button></div>
  ${isT()?teacherMood():''}`}
function kelasSubs(){return S.subs.filter(s=>!S.kelasSel||kk(s.kelas)===S.kelasSel)}
function teacherMood(){const ss=kelasSubs();const cnt={};FEELS.forEach(([e])=>cnt[e]=0);ss.forEach(s=>{if(cnt[s.feeling]!=null)cnt[s.feeling]++});const mx=Math.max(1,...Object.values(cnt));
  return `<div class="card" style="box-shadow:none"><h3>Peta perasaan kelas ${esc(S.kelasSel||'')}</h3><p class="muted" style="margin-bottom:10px">${ss.length} murid masuk. Diperbarui langsung.</p><div class="bars">${FEELS.map(([e,n])=>`<div class="bar"><span style="font-size:26px" title="${n}">${e}</span><i style="width:${Math.max(2,cnt[e]/mx*100)}%"></i><b>${cnt[e]}</b></div>`).join('')}</div></div>`}

/* 2. materi */
function itemsFor(cat){const real=S.mats.filter(i=>i.cat===cat).sort((a,b)=>(a.order||0)-(b.order||0));if(S.mats.length)return real;return EXAMPLES.filter(i=>i.cat===cat).map(i=>Object.assign({sample:true},i))}
function itemCard(it){
  const url=safeUrl(it.url),kd=KINDS[it.kind]||KINDS.link,focus=S.ui.item===it.id;
  const img=it.img&&/^data:image\//.test(it.img)?`<img class="item-img" src="${it.img}" alt="${esc(it.title)}">`:'';
  return `<article class="item ${focus?'focus':''}" data-item="${esc(it.id)}">${img}${it.kind==='qr'&&url?`<div class="qr" data-qr="${esc(url)}"></div>`:''}
   <div><span class="badge">${kd.n}</span>${it.sample?'<span class="badge ex">Contoh</span>':''}<h4>${esc(it.title)}</h4><p>${esc(it.desc)}</p></div>
   <div class="item-actions">${url?`<a class="btn sm" href="${esc(url)}" target="_blank" rel="noopener" data-act="openitem" data-id="${esc(it.id)}">${kd.cta}</a><button class="btn sm ghost" type="button" data-act="copy" data-v="${esc(url)}">Salin tautan</button>`:'<span class="muted">Belum ada tautan</span>'}
   ${isT()&&!it.sample?`<button class="btn sm ghost" type="button" data-act="edititem" data-id="${esc(it.id)}">Ubah</button>`:''}</div></article>`}
function rMateri(){
  const t=S.ui.mat;let h='';
  const cur=S.ui.item?S.mats.concat(EXAMPLES).find(i=>i.id===S.ui.item):null;
  if(!isT()&&cur&&safeUrl(cur.url))h+=`<div class="banner">Guru sedang membuka: ${esc(cur.title)} <a class="btn sm sun" style="margin-left:8px" href="${esc(safeUrl(cur.url))}" target="_blank" rel="noopener">Buka sekarang</a></div>`;
  h+=`<div class="sub" role="tablist">${[['gaya','Pilihan Gaya Belajar'],['media','Media Ajar'],['bahan','Bahan Ajar']].map(([k,n])=>`<button type="button" role="tab" aria-selected="${t===k}" class="${t===k?'on':''}" data-act="mat" data-k="${k}">${n}</button>`).join('')}</div>`;
  if(t==='gaya'){
    h+=`<div class="styles">${Object.entries(STYLES).map(([k,s])=>`<button type="button" class="style ${S.ui.style===k?'on':''}" style="--c:${s.c}" data-act="style" data-k="${k}">${ico(k)}<b>${s.n}</b><small>${s.s}</small></button>`).join('')}</div>`;
    if(S.ui.style){const it=itemsFor(S.ui.style);h+=`<h3>Materi ${STYLES[S.ui.style].n}</h3>`+(it.length?`<div class="items">${it.map(itemCard).join('')}</div>`:`<div class="empty">Belum ada materi untuk gaya ini.${isT()?' Tambahkan lewat tombol Atur.':''}</div>`)}
    else h+=`<div class="empty">Pilih satu gaya belajar di atas untuk melihat materinya.</div>`;
  }else{const it=itemsFor(t);h+=it.length?`<div class="items">${it.map(itemCard).join('')}</div>`:`<div class="empty">Belum ada ${t==='media'?'media':'bahan'} ajar.${isT()?' Tambahkan lewat tombol Atur.':''}</div>`}
  if(isT())h+=`<div class="row"><button class="btn sm sun" type="button" data-act="newitem">Tambah materi</button><span class="muted">Klik tombol buka pada materi: layar Anda langsung ke tautan, murid melihat sorotan di layarnya.</span></div>`;
  return h}

/* 3. asesmen */
function levelOf(s){const l=S.levels[s.id];if(l)return l==='tinggi'?3:l==='rendah'?1:2;const sc=scoreOf(s);if(sc==null)return 2;return sc>=.7?3:sc>=.4?2:1}
function scoreOf(s){let n=0,t=0;S.cfg.quiz.forEach(q=>{if(s.answers&&s.answers[q.id]!=null){t++;if(s.answers[q.id]===q.a)n++}});return t?n/t:null}
function myTeam(){const g=S.groups[kk(me().kelas)];if(!g||!S.uid)return null;return g.teams.find(t=>t.members.some(m=>m.id===S.uid))||null}
function rAsesmen(){
  const a=S.ui.as;
  return `<div class="sub">${[['kelompok','Kelompok Heterogen'],['game','Game TGT']].map(([k,n])=>`<button type="button" class="${a===k?'on':''}" data-act="as" data-k="${k}">${n}</button>`).join('')}</div>`+(a==='kelompok'?rKelompok():rGame())}
function rKelompok(){
  const key=isT()?S.kelasSel:kk(me().kelas);const g=S.groups[key];let h='';
  if(isT()){
    const ss=kelasSubs();const n=S.ui.nGroups||Math.max(2,Math.ceil(ss.length/4));
    h+=`<p class="muted">Sistem membagi murid kelas <b>${esc(S.kelasSel||'-')}</b> secara heterogen: tiap kelompok berisi campuran tingkat kemampuan tinggi, sedang, dan rendah (dari hasil kuis, atau Anda atur manual).</p>
    <div class="row"><label for="ng" style="font-weight:800">Jumlah kelompok</label><input id="ng" type="number" min="2" max="8" value="${n}" style="width:80px;min-height:42px;border-radius:12px;border:3px solid var(--outline);padding:4px 10px;background:var(--surface-2)">
    <button class="btn" type="button" data-act="makegroups" ${ss.length<2?'disabled':''}>${g?'Acak ulang':'Bagi kelompok otomatis'}</button></div>
    ${ss.length<2?'<div class="empty">Menunggu minimal 2 murid masuk ke kelas ini.</div>':''}
    ${ss.length?`<details><summary style="cursor:pointer;font-weight:800">Atur tingkat kemampuan murid (opsional)</summary><div class="stack" style="margin-top:10px">${ss.map(s=>{const l=S.levels[s.id]||'';return `<div class="mrow"><span class="grow">${esc(s.name)}</span><select data-act="level" data-id="${esc(s.id)}" aria-label="Tingkat ${esc(s.name)}"><option value="" ${!l?'selected':''}>Otomatis</option><option value="tinggi" ${l==='tinggi'?'selected':''}>Tinggi</option><option value="sedang" ${l==='sedang'?'selected':''}>Sedang</option><option value="rendah" ${l==='rendah'?'selected':''}>Rendah</option></select></div>`}).join('')}</div></details>`:''}`;
  }
  if(!g)return h+(isT()?'':`<div class="empty">Guru belum membagi kelompok. Tunggu sebentar ya.</div>`);
  const mine=!isT()?myTeam():null;
  if(mine)h+=`<div class="banner">Kamu ada di Tim ${esc(mine.name)}. Temui teman satu timmu!</div>`;
  h+=`<div class="teams">${g.teams.map((t,i)=>`<div class="team ${mine&&mine.name===t.name?'me':''}" style="--tc:${t.col};animation-delay:${i*70}ms"><h4><span>Tim ${esc(t.name)}</span><span>${t.pts||0} poin</span></h4><ul>${t.members.map(m=>`<li>${isT()?`<i class="lv lv${m.lv||2}" title="Tingkat"></i>`:''}${esc(m.name)}</li>`).join('')}</ul></div>`).join('')}</div>
  <div class="row"><button class="btn sm ghost" type="button" data-act="copyteams">Salin pembagian kelompok</button></div>`;
  return h}
function makeGroups(){
  const ss=shuffle(kelasSubs());const n=Math.min(8,Math.max(2,parseInt($('#ng').value)||2));S.ui.nGroups=n;
  ss.sort((a,b)=>levelOf(b)-levelOf(a));
  const teams=Array.from({length:n},(_,i)=>({name:TEAMNAME[i],col:TEAMCOL[i],pts:0,members:[]}));
  ss.forEach((s,i)=>{const r=Math.floor(i/n),c=i%n;const idx=r%2===0?c:n-1-c;teams[idx].members.push({id:s.id,name:s.name,lv:levelOf(s)})});
  S.groups[S.kelasSel]={teams,scored:{}};saveGroups();renderPanel();Music.sfx('ok');toast('Kelompok heterogen terbentuk')}
function saveGroups(){Data.set('class/groups',S.groups).catch(()=>toast('Gagal menyimpan kelompok'))}

/* game TGT */
function rGame(){
  const g=S.ui.game;
  if(!g){
    const web=itemsFor('game');
    return `<div class="tgt"><div><b>1 Tim</b>Bagi kelompok heterogen</div><div><b>2 Game</b>Kuis, kartu memori, atau game web</div><div><b>3 Turnamen</b>Skor tim terkumpul</div><div><b>4 Penghargaan</b>Papan skor dan juara</div></div>
    <div class="games">
     <button class="game" type="button" data-act="game" data-g="kuis" style="--c:var(--f3)"><b>Kuis Turnamen</b><small>Guru menayangkan soal, semua murid menjawab, poin masuk ke tim.</small></button>
     <button class="game" type="button" data-act="game" data-g="memori" style="--c:var(--f4)"><b>Kartu Memori</b><small>Cocokkan istilah dengan artinya secepat mungkin.</small></button>
     <button class="game" type="button" data-act="game" data-g="skor" style="--c:var(--f1)"><b>Papan Skor Tim</b><small>Ranking dan juara turnamen.</small></button>
     ${isT()?`<button class="game" type="button" data-act="game" data-g="acak" style="--c:var(--f2)"><b>Pilih Acak</b><small>Acak tim atau murid yang maju.</small></button>`:''}
     ${web.map(i=>{const u=safeUrl(i.url);return `<a class="game" ${u?`href="${esc(u)}" target="_blank" rel="noopener"`:''} style="--c:var(--f2)"><b>${esc(i.title)}</b><small>${esc(i.desc||'Game dari web lain')}</small></a>`}).join('')}
    </div>${isT()?`<div class="row"><button class="btn sm sun" type="button" data-act="newitem" data-cat="game">Tambah game dari web lain</button></div>`:''}`}
  const back=`<div class="row"><button class="btn sm ghost" type="button" data-act="game" data-g="">Semua game</button></div>`;
  return back+({kuis:gKuis,memori:gMemori,skor:gSkor,acak:gAcak}[g]||(()=>''))()}

function curQuiz(){const c=S.cls.quiz;return c?{q:S.cfg.quiz.find(q=>q.id===c.id),phase:c.phase}:null}
function gKuis(){
  const qs=S.cfg.quiz,cq=curQuiz();let h='';
  if(isT()){
    const ss=kelasSubs();
    h+=`<p class="muted">Tayangkan satu soal. Murid menjawab di layarnya, lalu buka kunci untuk memberi 10 poin per jawaban benar ke tim masing-masing.</p>`;
    if(cq&&cq.q){const cnt=cq.q.o.map((_,i)=>ss.filter(s=>s.answers&&s.answers[cq.q.id]===i).length);const ans=cnt.reduce((a,b)=>a+b,0);
      h+=`<div class="card" style="box-shadow:none"><h3>${esc(cq.q.q)}</h3><div class="opts" style="margin:12px 0">${cq.q.o.map((o,i)=>`<div class="opt ${cq.phase==='reveal'?(i===cq.q.a?'ok':''):''}"><span class="k">${'ABCD'[i]}</span>${esc(o)}<span class="n">${cnt[i]}</span></div>`).join('')}</div>
      <div class="row"><span class="chip">${ans} dari ${ss.length} murid menjawab</span>${cq.phase==='open'?`<button class="btn" type="button" data-act="reveal">Buka kunci dan beri poin</button>`:`<span class="chip on">Kunci terbuka</span>`}<button class="btn sm ghost" type="button" data-act="endquiz">Tutup soal</button></div></div>`}
    h+=`<div class="stack">${qs.map((q,i)=>`<div class="mrow"><b>${i+1}.</b><span class="grow">${esc(q.q)}</span><button class="btn sm" type="button" data-act="askq" data-id="${esc(q.id)}">Tayangkan</button></div>`).join('')}</div>${qs.length?'':'<div class="empty">Belum ada soal. Tambahkan lewat tombol Atur.</div>'}`;
    return h}
  if(!cq||!cq.q)return h+`<div class="empty">Menunggu guru menayangkan soal...</div>`;
  const q=cq.q,mine=me().answers[q.id];

   case 'copy':copyText(t.dataset.v);break;
   case 'mat':S.ui.mat=t.dataset.k;S.ui.item=null;if(isT())lead({mat:t.dataset.k,item:null,style:t.dataset.k==='gaya'?S.ui.style:null});renderPanel();break;
   case 'style':S.ui.style=t.dataset.k;S.ui.item=null;Music.sfx('pop');if(isT())lead({style:t.dataset.k,item:null});renderPanel();break;
   case 'openitem':S.ui.item=t.dataset.id;if(isT())lead({item:t.dataset.id});break;
   case 'newitem':itemForm({cat:t.dataset.cat||(S.ui.mat==='gaya'?S.ui.style||'visual':S.ui.mat==='media'?'media':'bahan'),kind:'link',title:'',desc:'',url:''});break;
   case 'edititem':{const it=S.mats.find(i=>i.id===t.dataset.id);if(it)itemForm(it);break}
   case 'delitem':try{await Data.del('materials/'+t.dataset.id);closeModal();toast('Materi dihapus')}catch(x){toast('Gagal menghapus')}break;
   case 'closemodal':closeModal();break;
   case 'as':S.ui.as=t.dataset.k;if(isT())lead({as:t.dataset.k,game:null});S.ui.game=null;renderPanel();break;
   case 'game':S.ui.game=t.dataset.g||null;if(isT())lead({game:S.ui.game,quiz:null});if(S.ui.game==='memori')S.mem=null;renderPanel();break;
   case 'makegroups':makeGroups();break;
   case 'level':break;
   case 'askq':lead({face:'asesmen',as:'game',game:'kuis',quiz:{id:t.dataset.id,phase:'open'}});S.ui.as='game';S.ui.game='kuis';renderPanel();break;
   case 'endquiz':lead({quiz:null});renderPanel();break;
   case 'reveal':{const cq=curQuiz();if(!cq)break;lead({quiz:{id:cq.q.id,phase:'reveal'}});const g=S.groups[S.kelasSel];
      if(g&&!(g.scored||{})[cq.q.id]){g.scored=g.scored||{};g.scored[cq.q.id]=true;let tot=0;g.teams.forEach(tm=>{const n=tm.members.filter(m=>{const s=S.subs.find(x=>x.id===m.id);return s&&s.answers&&s.answers[cq.q.id]===cq.q.a}).length;tm.pts=(tm.pts||0)+n*10;tot+=n*10});saveGroups();toast('Kunci dibuka. '+tot+' poin dibagikan ke tim.')}
      else if(!g)toast('Kunci dibuka. Bagi kelompok dulu agar poin masuk ke tim.');Music.sfx('ok');renderPanel();break}
   case 'ans':{const cq=curQuiz();if(!cq||cq.phase!=='open')break;S.me.answers[cq.q.id]=+t.dataset.i;Music.sfx('tap');persistMe();renderPanel();break}
   case 'mem':memTap(+t.dataset.i);break;
   case 'memnew':memStart();renderPanel();break;
   case 'pts':{const g=S.groups[S.kelasSel];if(g){const tm=g.teams[+t.dataset.i];tm.pts=Math.max(0,(tm.pts||0)+ +t.dataset.d);saveGroups();Music.sfx('ok');renderPanel()}break}
   case 'resetpts':{const g=S.groups[S.kelasSel];if(g){g.teams.forEach(x=>x.pts=0);g.scored={};saveGroups();renderPanel()}break}
   case 'copyscore':{const g=S.groups[S.kelasSel];if(g)copyText(g.teams.slice().sort((a,b)=>(b.pts||0)-(a.pts||0)).map((x,i)=>`${i+1}. Tim ${x.name}: ${x.pts||0} poin`).join('\n'));break}
   case 'copyteams':{const g=S.groups[isT()?S.kelasSel:kk(me().kelas)];if(g)copyText(g.teams.map(x=>`Tim ${x.name}: ${x.members.map(m=>m.name).join(', ')}`).join('\n'));break}
   case 'spin':spin(t.dataset.w);break;
   case 'rate':S.me.exit=Object.assign({a:[],r:0,sent:false},S.me.exit,{r:+t.dataset.n,sent:false});$$('.stars button').forEach(b=>{const on=+b.dataset.n===S.me.exit.r;b.classList.toggle('on',on);b.setAttribute('aria-checked',on)});$('#exitState').textContent='';persistMe();break;
   case 'sendexit':{const ex=S.me.exit||{a:[],r:0};ex.a=$$('.exa').map(x=>x.value.trim());if(!ex.a.some(Boolean)&&!ex.r){toast('Isi minimal satu jawaban dulu ya');break}ex.sent=true;ex.at=Date.now();S.me.exit=ex;await flushMe();const st=$('#exitState');st.textContent='Terkirim';st.className='chip on';Music.sfx('open');burst2();toast('Exit ticket terkirim');break}
   case 'unfollow':S.follow=false;renderPanel();topChips();break;
   case 'refollow':S.follow=true;followClass();topChips();break;
   case 'followtoggle':lead({follow:S.cls.follow===false});renderBar();break;
   case 'results':renderResults();show('results');break;
   case 'copytable':copyText(tableRows().map(r=>r.map(c=>String(c).replace(/[\t\n]/g,' ')).join('\t')).join('\n'));break;
   case 'copyrow':{const s=S.subs.find(x=>x.id===t.dataset.id);if(s)copyText(rowText(s));break}
   case 'delsub':if(t.dataset.sure){try{await Data.del('submissions/'+t.dataset.id);toast('Data murid dihapus')}catch(x){toast('Gagal menghapus')}}else{t.dataset.sure='1';t.textContent='Yakin?';setTimeout(()=>{if(t.isConnected){t.textContent='Hapus';delete t.dataset.sure}},3000)}break;
   case 'csv':{const csv='﻿'+tableRows().map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');try{await S.dl.save({filename:'hasil-smartbox.csv',data:csv});toast('CSV disimpan')}catch(x){if(x&&x.code!=='declined')toast('Unduhan tidak tersedia')}break}
   case 'settings':settings();break;
   case 'stab':settings(t.dataset.k);break;
   case 'tema':S.cfg.tema=t.dataset.k;applyCfg();$$('.sw').forEach(b=>b.classList.toggle('on',b===t));await saveCfg();break;
   case 'addq':$('#qList').insertAdjacentHTML('beforeend',qBlock({id:'q'+rid(),q:'',o:['','','',''],a:0}));break;
   case 'delq':t.closest('.qb').remove();break;
   case 'addm':if($$('.pair').length<8)$('#mList').insertAdjacentHTML('beforeend',mBlock({a:'',b:''}));break;
   case 'delm':t.closest('.pair').remove();break;
   case 'savecfg':{const nc=gatherCfg(t.dataset.tab);if(t.dataset.tab==='kuis'&&!nc.quiz.length){toast('Lengkapi minimal satu soal');break}S.cfg=nc;await saveCfg();toast('Tersimpan');applyCfg();break}
   case 'preview':S.preview=true;renderHello();topChips();renderBar();followClass();toast('Mode coba sebagai murid');break;
   case 'exitpreview':S.preview=false;renderHello();topChips();renderBar();break;
  }
});
async function saveCfg(){try{await Data.set('config/main',S.cfg)}catch(e){toast('Gagal menyimpan pengaturan')}}
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='note'){S.me.note=t.value;$('#noteCount').textContent=t.value.length;persistMe()}
  else if(t.classList.contains('exa')){S.me.exit=Object.assign({a:[],r:0,sent:false},S.me.exit);S.me.exit.a=$$('.exa').map(x=>x.value);S.me.exit.sent=false;const st=$('#exitState');if(st){st.textContent='';st.className='muted'}persistMe()}
  else if(t.id==='rq'){S.resFilter=t.value;const pos=t.selectionStart;renderResults();const n=$('#rq');n.focus();n.setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='ksel'){S.kelasSel=t.value;if(S.view==='panel')renderPanel()}
  else if(t.id==='rk'){S.resKelas=t.value;renderResults()}
  else if(t.dataset&&t.dataset.act==='level'){if(t.value)S.levels[t.dataset.id]=t.value;else delete S.levels[t.dataset.id];Data.set('class/levels',S.levels).catch(()=>{})}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});

/* ---------- data langsung ---------- */
function startWatch(){
  Data.doc('config/main',d=>{S.cfg=Object.assign(clone(DEF),d||{});applyCfg();if(S.opened&&S.view==='panel'&&!document.activeElement.closest('#pcontent textarea'))renderPanel()});
  Data.col('materials',l=>{S.mats=l;if(S.opened&&S.view==='panel'&&S.ui.face==='materi'&&!$('#modal').hidden===false)renderPanel()});
  Data.doc('class/state',d=>{S.cls=Object.assign({follow:true,face:null},d||{});if(S.opened){renderTray();renderBar();if(isT()){}else followClass()}});
  Data.doc('class/groups',d=>{S.groups=d||{};if(S.opened&&S.view==='panel'&&S.ui.face==='asesmen'&&!document.activeElement.matches('input,select,textarea'))renderPanel()});
  Data.doc('class/levels',d=>{S.levels=d||{}});
  if(S.teacher)Data.col('submissions',l=>{S.subs=l;if(!S.kelasSel||!kelasList().includes(S.kelasSel))S.kelasSel=kelasList()[0]||'';
    if(S.opened&&isT()){renderBar();if(S.view==='results')renderResults();else if(S.view==='panel'&&!document.activeElement.matches('input,select,textarea,details *'))renderPanel()}});
}
S.ready=(async function init(){
  try{const c=window.claude;if(c&&c.use){S.db=await c.use('db');S.user=await c.use('user');S.dl=await c.use('downloads')}}catch(e){S.db=null}
  Data.db=S.db;
  let canEdit=false,uid=null;
  if(S.user){try{canEdit=await S.user.canEdit();uid=await S.user.id();const w=await S.user.can('data.write');if(w===false)S.readOnly=true}catch(e){}}
  if(S.db){S.teacher=!!canEdit;S.uid=uid}else{S.teacher=true;let d=lsGet('sb_demo');if(!d){d='demo-'+rid();lsSet('sb_demo',d)}S.uid=d}
  const id=lsGet('sb_id');if(id){$('#inName').value=id.name||'';$('#inKelas').value=id.kelas||''}
  startWatch();
  if(S.teacher){$('#teacherAlt').hidden=false;$('#teacherNote').textContent=S.db?'Anda terdeteksi sebagai pemilik halaman ini. Masuk sebagai guru untuk memimpin kelas, atau isi nama dan kelas di atas untuk mencoba sebagai murid.':'Mode coba: data hanya tersimpan di halaman ini. Setelah dibagikan lewat Claude, data murid tersimpan bersama.'}
  if(S.readOnly&&!S.teacher)$('#loginErr').textContent='Akunmu hanya bisa melihat. Minta guru memberi akses Kontributor.';
  const mu=lsGet('sb_music');if(mu&&mu.on){/* musik menunggu interaksi pertama */document.addEventListener('click',function f(){document.removeEventListener('click',f);if(!Music.on){Music.start();musicUI()}},{once:true})}
})();
renderTray();applyCfg();
})();
</script>
